[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DUNE"
version = "0.3.0"
description = "Point kinetics nuclear reactor simulator with thermal hydraulics, poisoning, burnup, and wxPython GUI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hridoy Kabiraj", email = "rudrokabiraj@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
    "nuclear",
    "reactor",
    "simulator",
    "point-kinetics",
    "physics",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "matplotlib>=3.3",
    "pyserial>=3.0",
    "wxPython>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Hridoy-Kabiraj/DUNE"
Repository = "https://github.com/Hridoy-Kabiraj/DUNE"
Issues = "https://github.com/Hridoy-Kabiraj/DUNE/issues"

[project.scripts]
DUNE = "dune.DUNEReactor:main"
dune = "dune.DUNEReactor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]
exclude = ["src/dune/guiTemplate.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/dune/DUNEReactor.py" = ["E402"]
